<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Run to Bitti! 🏃‍♀️💨</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Sky Blue Gradient */
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%); 
            font-family: 'Nunito', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* --- THE SKY (Karan Aujla Clouds) --- */
        #sky-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 1; /* Behind everything */
            pointer-events: none;
        }

        .karan-cloud {
            position: absolute;
            opacity: 0.6;
            border-radius: 50%;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateX(100vw) rotate(0deg); }
            100% { transform: translateX(-20vw) rotate(360deg); }
        }

        /* --- THE GROUND --- */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 15vh;
            background: #4ec04e;
            border-top: 5px solid #2e8b2e;
            z-index: 5;
        }

        /* --- THE PLAYER (Gunnu) --- */
        #player {
            position: absolute;
            bottom: 15vh;
            left: 50px;
            width: 70px; /* Slightly bigger */
            height: 70px;
            background-image: url('gunnu.jpg'); /* HER PHOTO */
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* --- OBSTACLES --- */
        .obstacle {
            position: absolute;
            bottom: 15vh;
            font-size: 40px;
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            z-index: 9;
        }

        /* --- SCORE & UI --- */
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 20;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px white;
        }

        #score-board {
            font-size: 1.5rem;
            font-weight: 800;
            color: #333;
            background: rgba(255,255,255,0.8);
            padding: 5px 25px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            border: 2px solid #ff4d6d;
        }

        /* --- OVERLAYS (Start / Win / Lose) --- */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            color: white;
            text-align: center;
        }

        /* The Finish Line Prize (Bitti) */
        #bitti-prize {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #ff4d6d;
            background-image: url('bitti.jpg'); /* YOUR PHOTO */
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
            box-shadow: 0 0 30px #ff4d6d;
            display: none; /* Hidden until win */
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Pacifico', cursive;
            margin-top: 20px;
            box-shadow: 0 5px 0 #d63353;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .hidden { display: none !important; }

        /* Jump Animation */
        .jump { animation: jump-animation 0.6s ease-out; }
        @keyframes jump-animation {
            0% { bottom: 15vh; }
            50% { bottom: 45vh; }
            100% { bottom: 15vh; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="sky-container"></div>

        <div id="ui-layer">
            <h1>Run to Bitti! ❤️</h1>
            <div id="score-board">Distance: 0m / 750m</div>
        </div>

        <div id="ground"></div>
        <div id="player"></div>

        <div id="overlay">
            <div id="bitti-prize"></div> 
            
            <h2 id="msg-title" style="font-size: 2.5rem; margin-bottom: 10px;">Ready Gunnu?</h2>
            <p id="msg-text" style="font-size: 1.2rem;">Tap or Space to Jump!</p>
            <button id="start-btn" onclick="startGame()">Start Run</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const WIN_DISTANCE = 750; // Win at 750m
        // ---------------------

        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const overlay = document.getElementById('overlay');
        const scoreBoard = document.getElementById('score-board');
        const msgTitle = document.getElementById('msg-title');
        const msgText = document.getElementById('msg-text');
        const startBtn = document.getElementById('start-btn');
        const bittiPrize = document.getElementById('bitti-prize');
        const skyContainer = document.getElementById('sky-container');

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 5;
        let obstacles = [];
        let gameLoopId;
        let obstacleGeneratorId;

        // 1. GENERATE KARAN AUJLA SKY
        function generateSky() {
            // Create 8 floating Karans
            for(let i=0; i<8; i++) {
                let img = document.createElement('img');
                img.src = 'karan.jpg'; // KARAN PHOTO
                img.className = 'karan-cloud';
                
                // Random size (small small)
                let size = Math.random() * 40 + 30; // 30px to 70px
                img.style.width = size + 'px';
                
                // Random position
                img.style.top = Math.random() * 50 + '%';
                img.style.left = Math.random() * 100 + 'vw';
                
                // Random speed
                img.style.animationDuration = (Math.random() * 10 + 10) + 's';
                
                skyContainer.appendChild(img);
            }
        }
        generateSky();

        // 2. JUMP FUNCTION
        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            player.classList.add('jump');
            setTimeout(() => {
                player.classList.remove('jump');
                isJumping = false;
            }, 600);
        }

        // Controls
        document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
        document.addEventListener('touchstart', (e) => { jump(); });
        document.addEventListener('click', jump);

        // 3. OBSTACLES
        function createObstacle() {
            if (isGameOver) return;
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerText = "💔"; 
            obstacle.style.left = '100vw'; 
            gameContainer.appendChild(obstacle);
            obstacles.push(obstacle);

            let randomTime = Math.random() * 1500 + 1000; 
            obstacleGeneratorId = setTimeout(createObstacle, randomTime);
        }

        function moveObstacles() {
            if (isGameOver) return;

            obstacles.forEach((obstacle, index) => {
                let obstaclePos = parseInt(window.getComputedStyle(obstacle).getPropertyValue('left'));
                
                if (obstaclePos > -50) {
                    obstacle.style.left = (obstaclePos - gameSpeed) + 'px';
                } else {
                    obstacle.remove();
                    obstacles.splice(index, 1);
                }

                // Collision Detection
                let playerRect = player.getBoundingClientRect();
                let obstacleRect = obstacle.getBoundingClientRect();

                if (
                    playerRect.right > obstacleRect.left + 15 &&
                    playerRect.left < obstacleRect.right - 15 &&
                    playerRect.bottom > obstacleRect.top + 15
                ) {
                    gameOver();
                }
            });
        }

        // 4. MAIN GAME LOOP
        function gameLoop() {
            if (isGameOver) return;

            moveObstacles();
            score++;
            scoreBoard.innerText = "Distance: " + score + "m / " + WIN_DISTANCE + "m";

            // Increase speed slightly
            if (score % 200 === 0) gameSpeed++;

            // WIN CONDITION
            if (score >= WIN_DISTANCE) {
                gameWin();
                return;
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 5;
            bittiPrize.style.display = 'none'; // Hide Bitti
            overlay.classList.add('hidden');
            obstacles.forEach(obs => obs.remove());
            obstacles = [];
            gameLoop();
            createObstacle();
        }

        function gameOver() {
            isGameOver = true;
            clearTimeout(obstacleGeneratorId);
            cancelAnimationFrame(gameLoopId);
            msgTitle.innerText = "Oh no! 💔";
            msgText.innerText = "Don't let the heartbreak stop you!";
            startBtn.innerText = "Try Again";
            overlay.classList.remove('hidden');
        }

        function gameWin() {
            isGameOver = true;
            clearTimeout(obstacleGeneratorId);
            cancelAnimationFrame(gameLoopId);
            
            // SHOW BITTI
            bittiPrize.style.display = 'block'; 
            
            msgTitle.innerText = "YOU REACHED BITTI! ❤️";
            msgText.innerText = "Happy Valentine's Day Gunnu!";
            startBtn.innerText = "Run Again";
            startBtn.onclick = () => location.reload();
            overlay.classList.remove('hidden');
        }
    </script>
</body>
</html>
