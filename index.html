<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Run to Bitti! 🏃‍♀️💨</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%); 
            font-family: 'Nunito', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* --- THE SKY (Karan Aujla Clouds) --- */
        #sky-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 1; 
            pointer-events: none;
        }

        .karan-cloud {
            position: absolute;
            opacity: 0.5;
            border-radius: 50%;
            animation: float 25s linear infinite;
        }

        @keyframes float {
            0% { transform: translateX(100vw) rotate(0deg); }
            100% { transform: translateX(-20vw) rotate(360deg); }
        }

        /* --- THE GROUND --- */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 15vh;
            background: #4ec04e;
            border-top: 5px solid #2e8b2e;
            z-index: 5;
        }

        /* --- THE PLAYER (Gunnu) --- */
        #player {
            position: absolute;
            bottom: 15vh;
            left: 50px;
            width: 80px;
            height: 80px;
            background-image: url('gunnu.jpg'); /* HER PHOTO */
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* --- OBSTACLES (Broken Hearts) --- */
        .obstacle {
            position: absolute;
            bottom: 15vh;
            font-size: 40px;
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            z-index: 9;
        }

        /* --- THE FINISH LINE (Bitti) --- */
        .bitti-finish {
            position: absolute;
            bottom: 15vh;
            width: 120px;
            height: 120px;
            background-image: url('bitti.jpg'); /* YOUR PHOTO */
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            border: 5px solid #ff4d6d; /* Red border */
            box-shadow: 0 0 20px #ff4d6d;
            z-index: 9;
        }

        /* --- SCORE & UI --- */
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 20;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px white;
        }

        #score-board {
            font-size: 1.5rem;
            font-weight: 800;
            color: #333;
            background: rgba(255,255,255,0.8);
            padding: 5px 25px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            border: 2px solid #ff4d6d;
        }

        /* --- OVERLAYS --- */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            color: white;
            text-align: center;
        }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Pacifico', cursive;
            margin-top: 20px;
            box-shadow: 0 5px 0 #d63353;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .hidden { display: none !important; }

        /* Jump Animation */
        .jump { animation: jump-animation 0.6s ease-out; }
        @keyframes jump-animation {
            0% { bottom: 15vh; }
            50% { bottom: 45vh; }
            100% { bottom: 15vh; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="sky-container"></div>

        <div id="ui-layer">
            <h1>Run to Bitti! ❤️</h1>
            <div id="score-board">Distance: 0m / 1000m</div>
        </div>

        <div id="ground"></div>
        <div id="player"></div>

        <div id="overlay">
            <h2 id="msg-title" style="font-size: 2.5rem; margin-bottom: 10px;">Ready Gunnu?</h2>
            <p id="msg-text" style="font-size: 1.2rem;">Tap or Space to Jump!</p>
            <button id="start-btn" onclick="startGame()">Start Run</button>
        </div>
    </div>

    <script>
        // --- GAME SETTINGS ---
        const WIN_DISTANCE = 1000; 
        // ---------------------

        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const overlay = document.getElementById('overlay');
        const scoreBoard = document.getElementById('score-board');
        const msgTitle = document.getElementById('msg-title');
        const msgText = document.getElementById('msg-text');
        const startBtn = document.getElementById('start-btn');
        const skyContainer = document.getElementById('sky-container');

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 5;
        let obstacles = []; // This will hold hearts AND Bitti
        let gameLoopId;
        let obstacleGeneratorId;
        let bittiSpawned = false;

        // 1. GENERATE SKY
        function generateSky() {
            for(let i=0; i<8; i++) {
                let img = document.createElement('img');
                img.src = 'karan.jpg'; 
                img.className = 'karan-cloud';
                let size = Math.random() * 40 + 30; 
                img.style.width = size + 'px';
                img.style.top = Math.random() * 50 + '%';
                img.style.left = Math.random() * 100 + 'vw';
                img.style.animationDuration = (Math.random() * 10 + 10) + 's';
                skyContainer.appendChild(img);
            }
        }
        generateSky();

        // 2. JUMP
        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            player.classList.add('jump');
            setTimeout(() => {
                player.classList.remove('jump');
                isJumping = false;
            }, 600);
        }

        document.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
        document.addEventListener('touchstart', (e) => { jump(); });
        document.addEventListener('click', jump);

        // 3. SPAWN LOGIC
        function createObstacle() {
            if (isGameOver) return;

            // IF WE REACHED 1000m, SPAWN BITTI INSTEAD OF HEART
            if (score >= WIN_DISTANCE && !bittiSpawned) {
                spawnBitti();
                return; // Stop creating hearts
            }
            
            // If we are past win distance, don't spawn anything else
            if (bittiSpawned) return;

            // CREATE BROKEN HEART
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerText = "💔"; 
            obstacle.style.left = '100vw'; 
            obstacle.dataset.type = "heart"; // Tag it
            gameContainer.appendChild(obstacle);
            obstacles.push(obstacle);

            let randomTime = Math.random() * 1500 + 1000; 
            obstacleGeneratorId = setTimeout(createObstacle, randomTime);
        }

        function spawnBitti() {
            bittiSpawned = true;
            const bitti = document.createElement('div');
            bitti.classList.add('bitti-finish');
            bitti.style.left = '100vw';
            bitti.dataset.type = "bitti"; // Tag it
            gameContainer.appendChild(bitti);
            obstacles.push(bitti);
        }

        // 4. MOVE & COLLISION
        function moveObstacles() {
            if (isGameOver) return;

            obstacles.forEach((obs, index) => {
                let obsPos = parseInt(window.getComputedStyle(obs).getPropertyValue('left'));
                
                // Move Left
                if (obsPos > -150) {
                    obs.style.left = (obsPos - gameSpeed) + 'px';
                } else {
                    obs.remove();
                    obstacles.splice(index, 1);
                }

                // COLLISION DETECTION
                let playerRect = player.getBoundingClientRect();
                let obsRect = obs.getBoundingClientRect();

                // Check overlap
                if (
                    playerRect.right > obsRect.left + 20 &&
                    playerRect.left < obsRect.right - 20 &&
                    playerRect.bottom > obsRect.top + 20
                ) {
                    // WHAT DID WE HIT?
                    if (obs.dataset.type === "heart") {
                        gameOver();
                    } else if (obs.dataset.type === "bitti") {
                        gameWin();
                    }
                }
            });
        }

        // 5. GAME LOOP
        function gameLoop() {
            if (isGameOver) return;

            moveObstacles();
            
            // Only increase score until we see Bitti
            if (!bittiSpawned) {
                score++;
                scoreBoard.innerText = "Distance: " + score + "m / " + WIN_DISTANCE + "m";
                if (score % 200 === 0) gameSpeed++;
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            isGameOver = false;
            bittiSpawned = false;
            score = 0;
            gameSpeed = 5;
            overlay.classList.add('hidden');
            
            // Clear old stuff
            obstacles.forEach(obs => obs.remove());
            obstacles = [];
            
            gameLoop();
            createObstacle();
        }

        function gameOver() {
            isGameOver = true;
            clearTimeout(obstacleGeneratorId);
            cancelAnimationFrame(gameLoopId);
            msgTitle.innerText = "Oh no! 💔";
            msgText.innerText = "Don't let the heartbreak stop you!";
            startBtn.innerText = "Try Again";
            overlay.classList.remove('hidden');
        }

        function gameWin() {
            isGameOver = true;
            clearTimeout(obstacleGeneratorId);
            cancelAnimationFrame(gameLoopId);
            
            msgTitle.innerText = "YAY! ❤️";
            msgText.innerText = "I love you so much!";
            startBtn.innerText = "Play Again";
            startBtn.onclick = () => location.reload();
            overlay.classList.remove('hidden');
            
            // Emoji Rain
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerText = "❤️";
                heart.style.position = 'fixed';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.fontSize = '30px';
                heart.style.animation = 'drop 3s linear';
                document.body.appendChild(heart);
            }, 200);
            
            // Add style for rain
            const style = document.createElement('style');
            style.innerHTML = `@keyframes drop { to { top: 110vh; } }`;
            document.head.appendChild(style);
        }
    </script>
</body>
</html>
