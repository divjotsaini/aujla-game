<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Run for Gunnu! 🏃‍♂️💨</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%); /* Sky Blue */
            font-family: 'Nunito', sans-serif;
            touch-action: none; /* Prevents zooming on double tap */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* The Ground */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 15vh; /* Ground takes up bottom 15% */
            background: #4ec04e; /* Grass Green */
            border-top: 5px solid #2e8b2e;
            z-index: 1;
        }

        /* The Player (Karan) */
        #player {
            position: absolute;
            bottom: 15vh; /* Sits on top of ground */
            left: 50px;
            width: 60px;
            height: 60px;
            background-image: url('karan.jpg'); /* Uses your uploaded image */
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 2;
        }

        /* The Obstacle (Heartbreak) */
        .obstacle {
            position: absolute;
            bottom: 15vh;
            font-size: 40px;
            width: 50px;
            height: 50px;
            text-align: center;
            line-height: 50px;
            z-index: 2;
        }

        /* Score & UI */
        #ui-layer {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2rem;
            margin: 0;
            text-shadow: 2px 2px white;
        }

        #score-board {
            font-size: 1.5rem;
            font-weight: 800;
            color: #333;
            background: rgba(255,255,255,0.7);
            padding: 5px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }

        /* Start / Game Over Screen */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
        }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Pacifico', cursive;
            margin-top: 20px;
            box-shadow: 0 5px 0 #d63353;
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }

        /* Jump Animation */
        .jump {
            animation: jump-animation 0.6s ease-out;
        }

        @keyframes jump-animation {
            0% { bottom: 15vh; }
            50% { bottom: 45vh; } /* How high he jumps */
            100% { bottom: 15vh; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <h1>Run to Gunnu! ❤️</h1>
            <div id="score-board">Distance: 0m</div>
        </div>

        <div id="ground"></div>
        <div id="player"></div>

        <div id="overlay">
            <h2 id="msg-title" style="font-size: 2.5rem; margin-bottom: 10px;">Ready?</h2>
            <p id="msg-text" style="font-size: 1.2rem;">Tap or Space to Jump over the 💔</p>
            <button id="start-btn" onclick="startGame()">Start Run</button>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const overlay = document.getElementById('overlay');
        const scoreBoard = document.getElementById('score-board');
        const msgTitle = document.getElementById('msg-title');
        const msgText = document.getElementById('msg-text');
        const startBtn = document.getElementById('start-btn');

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 5;
        let obstacles = [];
        let gameLoopId;
        let obstacleGeneratorId;

        // JUMP FUNCTION
        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            player.classList.add('jump');

            setTimeout(() => {
                player.classList.remove('jump');
                isJumping = false;
            }, 600); // Must match animation duration
        }

        // LISTEN FOR CONTROLS (Tap or Spacebar)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') jump();
        });
        document.addEventListener('touchstart', (e) => {
            // e.preventDefault(); // Uncomment if scrolling is an issue
            jump();
        });
        document.addEventListener('click', jump);

        // CREATE OBSTACLES (The 💔)
        function createObstacle() {
            if (isGameOver) return;

            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerText = "💔"; // The enemy
            obstacle.style.left = '100vw'; // Start off-screen right
            gameContainer.appendChild(obstacle);
            obstacles.push(obstacle);

            // Randomize when the next obstacle comes (between 1 and 2 seconds)
            let randomTime = Math.random() * 1500 + 1000; 
            obstacleGeneratorId = setTimeout(createObstacle, randomTime);
        }

        // MOVE OBSTACLES & CHECK COLLISIONS
        function moveObstacles() {
            if (isGameOver) return;

            obstacles.forEach((obstacle, index) => {
                let obstaclePos = parseInt(window.getComputedStyle(obstacle).getPropertyValue('left'));
                
                // Move Left
                if (obstaclePos > -50) {
                    obstacle.style.left = (obstaclePos - gameSpeed) + 'px';
                } else {
                    // Remove if it goes off screen
                    obstacle.remove();
                    obstacles.splice(index, 1);
                }

                // COLLISION DETECTION
                // Get positions
                let playerRect = player.getBoundingClientRect();
                let obstacleRect = obstacle.getBoundingClientRect();

                // Check if they overlap (simple AABB collision)
                // We give a little buffer (10px) so hitboxes aren't too annoying
                if (
                    playerRect.right > obstacleRect.left + 10 &&
                    playerRect.left < obstacleRect.right - 10 &&
                    playerRect.bottom > obstacleRect.top + 10
                ) {
                    gameOver();
                }
            });
        }

        // MAIN GAME LOOP
        function gameLoop() {
            if (isGameOver) return;

            moveObstacles();
            
            // Increase Score
            score++;
            scoreBoard.innerText = "Distance: " + score + "m";

            // Increase speed slightly as you go
            if (score % 500 === 0) gameSpeed++;

            // WIN CONDITION (Reached 1000m)
            if (score >= 1000) {
                gameWin();
                return;
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 5;
            scoreBoard.innerText = "Distance: 0m";
            overlay.classList.add('hidden');
            
            // Clear old obstacles
            obstacles.forEach(obs => obs.remove());
            obstacles = [];

            // Start Loops
            gameLoop();
            createObstacle();
        }

        function gameOver() {
            isGameOver = true;
            clearTimeout(obstacleGeneratorId);
            cancelAnimationFrame(gameLoopId);
            
            msgTitle.innerText = "Oh no! 💔";
            msgText.innerText = "Don't let the heartbreak stop you!";
            startBtn.innerText = "Try Again";
            overlay.classList.remove('hidden');
        }

        function gameWin() {
            isGameOver = true;
            clearTimeout(obstacleGeneratorId);
            cancelAnimationFrame(gameLoopId);
            
            msgTitle.innerText = "YOU MADE IT! 🎉";
            msgText.innerText = "You reached Gunnu's heart! ❤️";
            startBtn.innerText = "Yay!";
            startBtn.onclick = () => location.reload(); // Refresh to play again
            overlay.classList.remove('hidden');
            
            // Confetti effect (simple emoji rain)
            startConfetti();
        }

        function startConfetti() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerText = "❤️";
                heart.style.position = 'fixed';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.fontSize = '30px';
                heart.style.animation = 'drop 3s linear';
                document.body.appendChild(heart);
                
                // Add keyframes for drop if not exists
                if(!document.getElementById('confetti-style')) {
                    const style = document.createElement('style');
                    style.id = 'confetti-style';
                    style.innerHTML = `@keyframes drop { to { top: 110vh; } }`;
                    document.head.appendChild(style);
                }
            }, 200);
        }

    </script>
</body>
</html>
