<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Karan! 🎵</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Stop scrolling */
            touch-action: manipulation; /* Makes tapping faster on phone */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ff4d6d;
            font-family: 'Pacifico', cursive;
            font-size: 2rem;
            margin: 20px 0 10px 0;
            text-shadow: 2px 2px 0px white;
        }

        .score-board {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ff4d6d;
            background: white;
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            z-index: 10;
        }

        /* The game area box */
        .game-container {
            position: relative;
            width: 90vw; /* 90% of screen width */
            height: 60vh; /* 60% of screen height */
            background: rgba(255, 255, 255, 0.4);
            border: 4px dashed #ff4d6d;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(255, 77, 109, 0.2);
        }

        /* Karan's Image Style */
        #karan {
            width: 90px; 
            height: 90px;
            position: absolute; /* Allows moving anywhere */
            cursor: pointer;
            border-radius: 50%; /* Circle shape */
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            object-fit: cover;
            transition: transform 0.1s;
            display: none; /* Hidden until game starts */
        }

        #karan:active {
            transform: scale(0.9);
        }

        /* "Yeah Baby" Pop-up Text */
        .popup-text {
            position: absolute;
            color: #ff4d6d;
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
            pointer-events: none; /* Let clicks pass through */
            animation: floatUp 0.8s ease-out forwards;
            z-index: 20;
            text-shadow: 1px 1px 0px white;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }

        /* Win Screen Overlay */
        #win-screen {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #win-screen h2 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 3rem;
            margin: 0;
        }

        #win-screen p {
            font-size: 1.5rem;
            color: #555;
            margin: 10px 0 30px 0;
        }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

    </style>
</head>
<body>

    <h1>Catch Karan! 🎵</h1>
    
    <div class="score-board">Score: <span id="score">0</span> / 10</div>

    <div class="game-container" id="game-area">
        <img src="karan.jpg" id="karan" alt="Karan Aujla">
    </div>

    <div id="win-screen">
        <h2>You Won! 🎉</h2>
        <p>Yeah Baby! Happy Valentine's! ❤️</p>
        <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const karan = document.getElementById('karan');
        const gameArea = document.getElementById('game-area');
        const scoreDisplay = document.getElementById('score');
        const winScreen = document.getElementById('win-screen');
        
        let score = 0;
        let gameActive = true;

        // Move Karan to a random spot inside the box
        function moveKaran() {
            if (!gameActive) return;

            // Get the size of the box and the image
            const containerWidth = gameArea.clientWidth;
            const containerHeight = gameArea.clientHeight;
            const imgSize = 90; // Size of Karan image

            // Calculate random X and Y
            const x = Math.random() * (containerWidth - imgSize);
            const y = Math.random() * (containerHeight - imgSize);

            karan.style.left = `${x}px`;
            karan.style.top = `${y}px`;
            karan.style.display = 'block'; // Show him
        }

        // What happens when she taps Karan
        karan.addEventListener('click', (e) => {
            if (!gameActive) return;

            // 1. Increase Score
            score++;
            scoreDisplay.innerText = score;
            
            // 2. Show "Yeah Baby" text where she clicked
            showYeahBaby(e.clientX, e.clientY);

            // 3. Check if she won
            if (score >= 10) {
                gameWon();
            } else {
                moveKaran(); // Move him again instantly
            }
        });

        // Effect for the text popping up
        function showYeahBaby(x, y) {
            const popup = document.createElement('div');
            popup.className = 'popup-text';
            popup.innerText = "Yeah Baby!"; // The text
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            document.body.appendChild(popup);

            // Remove it after 0.8 seconds
            setTimeout(() => {
                popup.remove();
            }, 800);
        }

        function gameWon() {
            gameActive = false;
            karan.style.display = 'none'; // Hide Karan
            winScreen.style.display = 'flex'; // Show win screen
        }

        // Start the game immediately
        moveKaran();

    </script>

</body>
</html>
